<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg-dark: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  --bg-light: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  --text-dark: white;
  --text-light: #222;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.light {
  background: var(--bg-light);
  color: var(--text-light);
}

.container {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  width: 92%;
  max-width: 420px;
  backdrop-filter: blur(10px);
}

.progress-bar {
  width: 100%;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.progress {
  height: 12px;
  width: 0%;
  background: #00ffcc;
  transition: width 1s linear;
}

.reward {
  font-size: 22px;
  margin-top: 10px;
  animation: pop 0.6s ease forwards;
}

@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  80% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
  <h2>🎥 Watch & Earn</h2>

  <!-- 💰 Balance display -->
  <h3 id="balance">💰 Balance: Loading...</h3>

  <p>Watch for <b>30 seconds</b> to earn <b>10 points</b></p>

  <iframe width="100%" height="220"
    src="https://www.youtube.com/embed/N0W_6SqVtfc?autoplay=1"
    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
  </iframe>

  <h3 id="timer">⏳ 30</h3>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <p id="status">Watching...</p>

  <button onclick="toggleTheme()">Toggle Dark/Light</button>

  <div id="reward"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const uid = tg.initDataUnsafe?.user?.id;
if (!uid) {
  document.getElementById("status").innerText = "Open inside Telegram";
  throw new Error("No UID");
}

const API = "https://server-verify-production-80b2.up.railway.app";

let seconds = 30;
let rewarded = false;

const progress = document.getElementById("progress");
const timerText = document.getElementById("timer");
const rewardBox = document.getElementById("reward");

// 🔄 Load balance
async function loadBalance() {
  const res = await fetch(`${API}/balance/${uid}`);
  const data = await res.json();
  document.getElementById("balance").innerText =
    `💰 Balance: ${data.balance} pts`;
}

loadBalance();

// ⏳ Countdown
const timer = setInterval(async () => {
  seconds--;
  timerText.innerText = "⏳ " + seconds;
  progress.style.width = ((30 - seconds) / 30) * 100 + "%";

  if (seconds <= 0 && !rewarded) {
    rewarded = true;
    clearInterval(timer);

    document.getElementById("status").innerText = "Adding points...";

    // Call API
    await fetch(`${API}/verify`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ uid: String(uid) })
    });

    // 🎉 Animation
    rewardBox.innerHTML = '<div class="reward">🎉 +10 Points</div>';

    document.getElementById("status").innerText = "✅ Points added!";

    // 🔄 Refresh balance
    loadBalance();
  }
}, 1000);

// 🌗 Theme toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
