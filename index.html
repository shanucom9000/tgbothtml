<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Watch & Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="text-align:center;font-family:Arial;">

<h2>🎥 Watch & Earn</h2>
<h3 id="balance">💰 Balance: Loading...</h3>

<p>Watch 30 seconds to earn 10 points</p>

<iframe width="100%" height="220"
src="https://www.youtube.com/embed/N0W_6SqVtfc?autoplay=1"
frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
</iframe>

<p id="status">⏳ Watching...</p>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Safe UID detection
let uid = null;

if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
  uid = tg.initDataUnsafe.user.id;
} else {
  document.getElementById("status").innerText =
    "⚠️ Not opened inside Telegram.";
}

// API URL
const API = "https://server-verify-production-80b2.up.railway.app";

// Load balance
async function loadBalance() {
  if (!uid) return;
  const res = await fetch(`${API}/balance/${uid}`);
  const data = await res.json();
  document.getElementById("balance").innerText =
    `💰 Balance: ${data.balance} pts`;
}

loadBalance();

let seconds = 30;

const timer = setInterval(async () => {
  seconds--;
  document.getElementById("status").innerText =
    "⏳ " + seconds + " seconds remaining";

  if (seconds <= 0 && uid) {
    clearInterval(timer);

    await fetch(`${API}/verify`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ uid: String(uid) })
    });

    document.getElementById("status").innerText = "✅ Points added!";
    loadBalance();
  }
}, 1000);
</script>

</body>
</html>
