<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Points</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        #player { width: 100%; max-width: 560px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #status { font-weight: bold; color: #0088cc; margin-top: 15px; }
    </style>
</head>
<body>
    <h3>Watch for 30 seconds to earn 10 points!</h3>
    <div id="player"></div>
    <div id="status">Waiting for you to press play...</div>

    <script>
        const tg = window.Telegram.WebApp;
        // Your Google Script URL is correct
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww7K-cnnvgJ4lLklQE7VK1i1zjB02fs7GM7_yKM3smgq56E9fpecJD3yXGVJlMlA0/exec";
        
        let player;
        let timer;
        let secondsWatched = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '100%',
                videoId: 'N0W_6SqVtfc', // FIXED: Removed the ?si= tracking code
                playerVars: {
                    'playsinline': 1, // Required for mobile play
                    'origin': window.location.origin // Required for GitHub Pages
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            // When video starts playing
            if (event.data == YT.PlayerState.PLAYING) {
                if (!timer) {
                    document.getElementById('status').innerText = "Verifying watch time...";
                    timer = setInterval(() => {
                        secondsWatched++;
                        document.getElementById('status').innerText = `Keep watching: ${secondsWatched}/30s`;
                        if (secondsWatched >= 30) {
                            clearInterval(timer);
                            sendPoints();
                        }
                    }, 1000);
                }
            } 
            // When video is paused or ended
            else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                clearInterval(timer);
                timer = null;
                if (secondsWatched < 30) {
                    document.getElementById('status').innerText = "Video paused. Resume to earn points.";
                }
            }
        }

        function sendPoints() {
            document.getElementById('status').innerText = "✅ Success! Sending points...";
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    userId: tg.initDataUnsafe.user.id
                })
            }).then(() => {
                document.getElementById('status').innerText = "Points added! Closing app...";
                setTimeout(() => { tg.close(); }, 2500);
            }).catch(err => {
                document.getElementById('status').innerText = "Error sending points. Try again.";
            });
        }
    </script>
</body>
</html>
