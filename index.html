<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Points - Watch Video</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #e67e22;
        }
        .container { padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Watch for 30 seconds to earn 10 points</h3>
        <div id="player"></div>
        <div id="status">Waiting for play...</div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        // Replace these values with your Firebase Web Config from the Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyD6cAYeQYM9wRpEdmwdJy09NOgo6t7_pes", 
            authDomain: "verify-53031.firebaseapp.com",
            databaseURL: "https://verify-53031-default-rtdb.firebaseio.com", // Verify this URL in your console
            projectId: "verify-53031",
            storageBucket: "verify-53031.appspot.com",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. TELEGRAM WEB APP SETUP ---
        const tg = window.Telegram.WebApp;
        tg.expand(); // Open to full height
        const userId = tg.initDataUnsafe?.user?.id;

        // --- 3. YOUTUBE PLAYER LOGIC ---
        let player;
        let timerStarted = false;
        let timeLeft = 30;

        // Load YT API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '240',
                width: '100%',
                videoId: 'N0W_6SqVtfc', // Replace with your video ID
                playerVars: { 'playsinline': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING && !timerStarted) {
                timerStarted = true;
                startCountdown();
            }
        }

        function startCountdown() {
            const statusDiv = document.getElementById('status');
            const interval = setInterval(() => {
                timeLeft--;
                statusDiv.innerText = `Keep watching: ${timeLeft}s remaining`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    addPoints();
                }
            }, 1000);
        }

        // --- 4. REWARD LOGIC ---
        function addPoints() {
            if (!userId) {
                alert("Error: User ID not found from Telegram.");
                return;
            }

            const userRef = database.ref('users/' + userId);
            
            // Transaction safely increments the balance
            userRef.transaction((user) => {
                if (user) {
                    user.balance = (user.balance || 0) + 10;
                }
                return user;
            }, (error, committed) => {
                if (committed) {
                    document.getElementById('status').innerText = "✅ 10 Points Added!";
                    document.getElementById('status').style.color = "#2ecc71";
                    
                    // Close the web app after a short delay
                    setTimeout(() => {
                        tg.close();
                    }, 2000);
                } else {
                    console.error("Transaction failed:", error);
                }
            });
        }
    </script>
</body>
</html>
