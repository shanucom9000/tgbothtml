<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Watch & Earn</title>
</head>
<body style="text-align:center;font-family:Arial;">

<h2>🎥 Watch & Earn</h2>
<p>Watch 30 seconds to earn 10 points</p>

<div id="player"></div>
<h3 id="timer">⏳ Waiting for video...</h3>
<p id="status">Press play to start</p>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

const API = "https://server-verify-production-80b2.up.railway.app"; // 🔁 CHANGE THIS

let player;
let seconds = 0;
let timer = null;
let rewarded = false;

// YouTube player
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '220',
    width: '100%',
    videoId: 'N0W_6SqVtfc',
    events: { 'onStateChange': onPlayerStateChange }
  });
}

// Detect play/pause
function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING && !rewarded) startTimer();
  if (event.data === YT.PlayerState.PAUSED) stopTimer();
}

// Start timer
function startTimer() {
  if (timer) return;

  timer = setInterval(async () => {
    seconds++;
    document.getElementById("timer").innerText = "⏳ " + seconds + " / 30";

    if (seconds >= 30 && !rewarded) {
      rewarded = true;
      clearInterval(timer);

      document.getElementById("status").innerText = "Adding points...";

      await fetch(`${API}/verify`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ uid: String(uid) })
      });

      document.getElementById("status").innerText = "✅ Points added!";
    }
  }, 1000);
}

// Pause timer
function stopTimer() {
  clearInterval(timer);
  timer = null;
  document.getElementById("status").innerText = "Paused";
}
</script>

</body>
</html>
