<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn</title>

<!-- ✅ Telegram WebApp Script -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg-dark: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  --bg-light: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  --text-dark: white;
  --text-light: #222;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  transition: 0.3s;
}

.light {
  background: var(--bg-light);
  color: var(--text-light);
}

.container {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  width: 92%;
  max-width: 420px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

.theme-btn {
  background: #00ffcc;
}

.progress-bar {
  width: 100%;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.progress {
  height: 12px;
  width: 0%;
  background: #00ffcc;
  transition: width 1s linear;
}

.status {
  margin-top: 12px;
  font-size: 14px;
}

.timer {
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

.reward {
  font-size: 22px;
  margin-top: 10px;
  animation: pop 0.6s ease forwards;
}

@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  80% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
  <h2>🎥 Watch & Earn</h2>
  <p>Watch for <b>30 seconds</b> to earn <b>10 points</b></p>

  <iframe width="100%" height="220"
    src="https://www.youtube.com/embed/N0W_6SqVtfc?autoplay=1"
    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
  </iframe>

  <div class="timer" id="timer">⏳ 30</div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <div class="status" id="status">Watching...</div>

  <button class="theme-btn" onclick="toggleTheme()">Toggle Dark/Light</button>

  <div id="reward"></div>
</div>

<script>
// ✅ Initialize Telegram WebApp
const tg = window.Telegram.WebApp;
tg.expand();

// ✅ Get Telegram user ID securely
const user = tg.initDataUnsafe?.user;
const uid = user ? user.id : null;

if (!uid) {
  document.getElementById("status").innerText = "⚠️ Unable to detect Telegram user.";
  throw new Error("No Telegram UID");
}

// 🔒 Anti-cheat: prevent repeat reward in same browser
if (localStorage.getItem("rewarded_" + uid)) {
  document.getElementById("status").innerText = "⚠️ Reward already claimed.";
  throw new Error("Already rewarded");
}

let seconds = 30;
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const timerText = document.getElementById("timer");
const rewardBox = document.getElementById("reward");

const timer = setInterval(() => {
  seconds--;
  timerText.innerText = "⏳ " + seconds;
  progress.style.width = ((30 - seconds) / 30) * 100 + "%";

  if (seconds <= 0) {
    clearInterval(timer);
    status.innerText = "✅ Verified!";

    // 🎉 Reward animation
    rewardBox.innerHTML = '<div class="reward">🎉 +10 Points</div>';

    // mark rewarded locally
    localStorage.setItem("rewarded_" + uid, "true");

    // 📡 Call your API
    fetch("https://server-verify-production-80b2.up.railway.app/verify", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ uid: uid })
    });
  }
}, 1000);

// 🌗 Theme toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
