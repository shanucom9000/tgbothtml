<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        #claim-btn { display: none; padding: 15px 30px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <div id="player"></div>
    <h2 id="status">Watch 30s to unlock points</h2>
    
    <button id="claim-btn" onclick="claimPoints()">✅ Claim 10 Points</button>

    <script>
        const tg = window.Telegram.WebApp;
        let seconds = 0;

        function onYouTubeIframeAPIReady() {
            new YT.Player('player', {
                height: '360', width: '100%', videoId: 'N0W_6SqVtfc',
                events: { 'onStateChange': (e) => {
                    if (e.data == 1) { // 1 = Playing
                        let timer = setInterval(() => {
                            seconds++;
                            document.getElementById('status').innerText = `Progress: ${seconds}/30s`;
                            if (seconds >= 30) {
                                clearInterval(timer);
                                document.getElementById('status').style.display = 'none';
                                document.getElementById('claim-btn').style.display = 'inline-block';
                            }
                        }, 1000);
                    }
                }}
            });
        }

        function claimPoints() {
            // Generate a random token for this session
            const randomToken = Math.floor(Math.random() * 1000000) + "777";
            // Redirect user back to the bot with the token
            const botUsername = "YOUR_BOT_USERNAME"; // e.g., MyPointsBot
            window.location.href = `https://t.me/${botUsername}?start=claim_${randomToken}`;
        }
    </script>
</body>
</html>
