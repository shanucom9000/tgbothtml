<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fff; }
        #player { border-radius: 15px; overflow: hidden; margin-top: 10px; }
        #status { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #f39c12; }
    </style>
</head>
<body>
    <h3>Earn 10 Points</h3>
    <div id="player"></div>
    <div id="status">Play the video to start timer...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6cAYeQYM9wRpEdmwdJy09NOgo6t7_pes", 
            authDomain: "verify-53031.firebaseapp.com",
            databaseURL: "https://verify-53031-default-rtdb.firebaseio.com",
            projectId: "verify-53031"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id;

        let player;
        let timerStarted = false;
        let secondsLeft = 30;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '240', width: '100%',
                videoId: 'YOUR_YT_VIDEO_ID', 
                events: { 'onStateChange': (e) => {
                    if (e.data == YT.PlayerState.PLAYING && !timerStarted) {
                        timerStarted = true;
                        startTimer();
                    }
                }}
            });
        }

        function startTimer() {
            const timer = setInterval(() => {
                secondsLeft--;
                document.getElementById('status').innerText = "Wait: " + secondsLeft + "s";
                if (secondsLeft <= 0) {
                    clearInterval(timer);
                    addPoints();
                }
            }, 1000);
        }

        function addPoints() {
            if (!userId) { alert("User ID missing"); return; }
            const ref = database.ref('users/' + userId);
            
            ref.once('value').then(snap => {
                let data = snap.val() || { balance: 0 };
                return ref.update({ balance: (data.balance || 0) + 10 });
            }).then(() => {
                document.getElementById('status').innerText = "✅ Success! Closing...";
                document.getElementById('status').style.color = "green";
                setTimeout(() => tg.close(), 2000);
            }).catch(err => {
                document.getElementById('status').innerText = "Error: " + err.message;
            });
        }
    </script>
</body>
</html>
